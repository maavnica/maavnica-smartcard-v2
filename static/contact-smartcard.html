<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact – Maavnica SmartCard</title>
  <style>
    body {
      margin:0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:#0F172A;
      color:white;
    }
    .section { padding:40px 20px; }
    .container { max-width:600px; margin:0 auto; }
    h1 { font-size:26px; font-weight:800; margin-bottom:8px; text-align:center; }
    p { font-size:14px; color:#E5E7EB; text-align:center; margin-bottom:18px; }

    form {
      background:#020617;
      border-radius:16px;
      padding:20px 18px;
      border:1px solid #1D4ED8;
      box-shadow:0 14px 40px rgba(15,23,42,0.8);
    }
    label {
      display:block;
      font-size:13px;
      margin-bottom:4px;
      color:#E5E7EB;
    }
    input, select, textarea {
      width:100%;
      padding:9px 10px;
      border-radius:8px;
      border:1px solid #1E293B;
      margin-bottom:12px;
      font-size:13px;
      font-family:inherit;
      background:#020617;
      color:white;
    }
    textarea { min-height:80px; resize:vertical; }

    button {
      width:100%;
      padding:11px;
      border-radius:999px;
      border:none;
      background:#1D4ED8;
      color:white;
      font-weight:600;
      font-size:14px;
      cursor:pointer;
      margin-top:4px;
    }
    button:hover { opacity:.9; }

    .back-link {
      display:inline-block;
      margin-top:16px;
      font-size:13px;
      color:#93C5FD;
      text-decoration:underline;
      text-underline-offset:3px;
      text-align:center;
      width:100%;
    }

    .info {
      font-size:11px;
      color:#9CA3AF;
      margin-top:10px;
      text-align:center;
    }
  </style>
</head>
<body>

  <section class="section">
    <div class="container">
      <h1>Demande SmartCard / Affiliation</h1>
      <p>Remplissez ce formulaire, votre demande sera envoyée à l’équipe Maavnica (contact@maavnica.com).</p>

      <form action="mailto:contact@maavnica.com?subject=Demande%20Maavnica%20SmartCard" method="post" enctype="text/plain">
        <label for="type">Objet de votre demande</label>
        <select id="type" name="Objet de la demande">
          <option value="Commande SmartCard Solo">Commande SmartCard Solo</option>
          <option value="Passer en offre Pro">Passer en offre Pro (8,90 € / mois)</option>
          <option value="Offre Business">Offre Business (19,90 € / mois)</option>
          <option value="Affiliation Maavnica">Devenir affilié Maavnica</option>
          <option value="Autre">Autre / question</option>
        </select>

        <label for="nom">Nom / Prénom</label>
        <input type="text" id="nom" name="Nom" required />

        <label for="activite">Activité / Entreprise</label>
        <input type="text" id="activite" name="Activité" />

        <label for="email">Email</label>
        <input type="email" id="email" name="Email" required />

        <label for="tel">Téléphone</label>
        <input type="text" id="tel" name="Téléphone" />

        <label for="message">Votre besoin / message</label>
        <textarea id="message" name="Message" placeholder="Expliquez en quelques lignes ce que vous souhaitez (commande, affiliation, questions...)"></textarea>

        <button type="submit">Envoyer ma demande</button>
      </form>

      <a href="/static/index.html" class="back-link">← Revenir à la page SmartCard</a>

      <div class="info">
        Si le formulaire ne s’ouvre pas correctement, vous pouvez écrire directement à : contact@maavnica.com
      </div>
    </div>
  </section>

</body>
</html>
