<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Générateur kit affilié — interne Maavnica</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      line-height: 1.5;
      min-height: 100vh;
      padding: 24px 16px 40px;
    }
    .wrap { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 1.25rem; font-weight: 800; margin-bottom: 6px; }
    .sub { font-size: 0.85rem; color: #94a3b8; margin-bottom: 22px; }
    label { display: block; font-size: 0.75rem; font-weight: 600; color: #94a3b8; margin-bottom: 4px; margin-top: 12px; }
    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: #020617;
      color: #f1f5f9;
      font-size: 0.95rem;
    }
    input:focus { outline: none; border-color: #22c55e; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 520px) { .row { grid-template-columns: 1fr; } }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
    button {
      padding: 10px 16px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      border: none;
    }
    .btn-primary { background: #22c55e; color: #052e16; }
    .btn-secondary { background: rgba(148, 163, 184, 0.2); color: #e2e8f0; border: 1px solid rgba(148, 163, 184, 0.35); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .msg { margin-top: 16px; padding: 12px 14px; border-radius: 10px; font-size: 0.9rem; display: none; }
    .msg.ok { display: block; background: rgba(34, 197, 94, 0.15); border: 1px solid rgba(34, 197, 94, 0.4); color: #bbf7d0; }
    .msg.err { display: block; background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.35); color: #fecaca; }
    #previewBox {
      margin-top: 20px;
      display: none;
      padding: 14px;
      border-radius: 12px;
      background: #020617;
      border: 1px solid rgba(51, 65, 85, 0.8);
    }
    #previewBox.visible { display: block; }
    #previewBox h2 { font-size: 0.85rem; color: #94a3b8; margin-bottom: 8px; }
    #previewContent { white-space: pre-wrap; font-size: 0.8rem; color: #cbd5e1; font-family: ui-monospace, monospace; }
    .hint { font-size: 0.72rem; color: #64748b; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Générateur kit affilié</h1>
    <p class="sub">Outil interne — envoi du kit par email (clé admin requise).</p>

    <form id="kitForm" novalidate>
      <div class="row">
        <div>
          <label for="first_name">Prénom</label>
          <input id="first_name" name="first_name" type="text" required autocomplete="given-name" />
        </div>
        <div>
          <label for="last_name">Nom</label>
          <input id="last_name" name="last_name" type="text" required autocomplete="family-name" />
        </div>
      </div>
      <label for="email">Email affilié</label>
      <input id="email" name="email" type="email" required autocomplete="email" />
      <label for="affiliate_ref">Référence affilié (slug)</label>
      <input id="affiliate_ref" name="affiliate_ref" type="text" required placeholder="ex: paul_dupont" autocomplete="off" />

      <div class="actions">
        <button type="button" class="btn-secondary" id="btnPreview">Prévisualiser le kit</button>
        <button type="submit" class="btn-primary" id="btnSend">Générer et envoyer le kit</button>
      </div>
    </form>

    <p id="msgOk" class="msg ok"></p>
    <p id="msgErr" class="msg err"></p>

    <div id="previewBox">
      <h2>Aperçu (texte brut)</h2>
      <div id="previewContent"></div>
    </div>

    <p class="hint">
      Les liens utilisent la base https://smartcard.maavnica.com et votre référence. La clé admin est demandée une fois par session (stockage session du navigateur).
    </p>
  </div>

  <script>
    (function () {
      var API_SEND = "https://maavnica-smartcard-v2.onrender.com/api/affiliate-kit/send";
      var BASE = "https://smartcard.maavnica.com";
      var REF_RE = /^[a-z0-9][a-z0-9_-]{0,31}$/;

      function normalizeRef(raw) {
        var s = String(raw || "").trim().toLowerCase().replace(/[^a-z0-9_-]/g, "").slice(0, 32);
        if (!s || !REF_RE.test(s)) return "";
        return s;
      }

      function ensureAdminKey() {
        var k = sessionStorage.getItem("ADMIN_API_KEY") || "";
        if (k && k.trim()) return k.trim();
        var entered = window.prompt("Clé admin (Authorization Bearer) :");
        if (entered === null) return "";
        k = String(entered).trim();
        if (!k) return "";
        sessionStorage.setItem("ADMIN_API_KEY", k);
        return k;
      }

      function buildPreviewText(first, last, ref) {
        var links = {
          main: BASE + "/?ref=" + ref,
          solo: BASE + "/static/contact-smartcard.html?offre=solo&ref=" + ref,
          business: BASE + "/static/contact-smartcard.html?offre=business&ref=" + ref
        };
        var display = (first + " " + last).trim();
        var wa =
          "Bonjour, je te partage la SmartCard Maavnica (carte pro digitale, avis Google, devis, QR…) : " +
          links.main;
        var sms = "SmartCard Maavnica pour pros : " + links.main;
        return [
          "Bonjour " + display + ",",
          "",
          "Bienvenue dans le programme d’affiliation Maavnica SmartCard.",
          "Votre référence affilié : " + ref,
          "",
          "— Vos liens personnels —",
          "Lien principal : " + links.main,
          "Lien Solo : " + links.solo,
          "Lien Business : " + links.business,
          "",
          "— Rémunération —",
          "20 € par SmartCard Solo vendue (39 € HT / an).",
          "35 € par offre Business vendue (99 € HT / an).",
          "",
          "— WhatsApp —",
          wa,
          "",
          "— SMS —",
          sms,
          "",
          "Important : partager uniquement ces liens pour le tracking."
        ].join("\n");
      }

      function showOk(t) {
        var ok = document.getElementById("msgOk");
        var err = document.getElementById("msgErr");
        if (err) err.style.display = "none";
        if (ok) {
          ok.textContent = t;
          ok.style.display = "block";
        }
      }

      function showErr(t) {
        var ok = document.getElementById("msgOk");
        var err = document.getElementById("msgErr");
        if (ok) ok.style.display = "none";
        if (err) {
          err.textContent = t;
          err.style.display = "block";
        }
      }

      function hideMsgs() {
        var ok = document.getElementById("msgOk");
        var err = document.getElementById("msgErr");
        if (ok) ok.style.display = "none";
        if (err) err.style.display = "none";
      }

      document.getElementById("btnPreview").addEventListener("click", function () {
        hideMsgs();
        var fn = document.getElementById("first_name").value.trim();
        var ln = document.getElementById("last_name").value.trim();
        var ref = normalizeRef(document.getElementById("affiliate_ref").value);
        if (!ref) {
          showErr("Référence affilié invalide (slug : lettres, chiffres, tirets, max 32 car.).");
          document.getElementById("previewBox").classList.remove("visible");
          return;
        }
        document.getElementById("previewContent").textContent = buildPreviewText(fn, ln, ref);
        document.getElementById("previewBox").classList.add("visible");
      });

      document.getElementById("kitForm").addEventListener("submit", async function (e) {
        e.preventDefault();
        hideMsgs();
        var btn = document.getElementById("btnSend");
        var adminKey = ensureAdminKey();
        if (!adminKey) {
          showErr("Clé admin requise pour envoyer le kit.");
          return;
        }

        var first_name = document.getElementById("first_name").value.trim();
        var last_name = document.getElementById("last_name").value.trim();
        var email = document.getElementById("email").value.trim();
        var affiliate_ref = normalizeRef(document.getElementById("affiliate_ref").value);

        if (!affiliate_ref) {
          showErr("Référence affilié invalide.");
          return;
        }

        btn.disabled = true;
        try {
          var res = await fetch(API_SEND, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Accept: "application/json",
              Authorization: "Bearer " + adminKey
            },
            body: JSON.stringify({
              first_name: first_name,
              last_name: last_name,
              email: email,
              affiliate_ref: affiliate_ref
            })
          });
          var data = null;
          try {
            data = await res.json();
          } catch (x) {}

          if (!res.ok) {
            var detail =
              data && data.detail
                ? typeof data.detail === "string"
                  ? data.detail
                  : JSON.stringify(data.detail)
                : "Erreur " + res.status;
            showErr(detail);
            return;
          }
          showOk(data && data.message ? data.message : "Kit affilié envoyé avec succès.");
        } catch (err) {
          showErr("Erreur réseau ou serveur injoignable.");
        } finally {
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
