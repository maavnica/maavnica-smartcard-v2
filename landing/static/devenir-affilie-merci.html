<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Merci — Inscription affilié</title>
  <style>
    body{
      margin:0; min-height:100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(1200px 650px at 15% 0%, rgba(70,120,255,.18), transparent 60%),
        radial-gradient(900px 520px at 80% 10%, rgba(255,205,80,.12), transparent 55%),
        linear-gradient(180deg, #050a13, #070f1f);
      color:#eaf2ff;
      display:grid; place-items:center;
      padding:24px;
    }
    .box{
      width:min(820px, 100%);
      border:1px solid rgba(255,255,255,.10);
      border-radius:18px;
      background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      box-shadow:0 18px 60px rgba(0,0,0,.55);
      padding:22px;
    }
    h1{margin:0 0 8px; font-size:28px}
    p{margin:0 0 14px; color:rgba(255,255,255,.75); line-height:1.55}
    .btn{
      display:inline-flex; align-items:center; justify-content:center;
      height:44px; padding:0 16px; border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.05);
      color:#eaf2ff; text-decoration:none;
      font-weight:650;
    }
    .btn:hover{opacity:.95}
    .row{display:flex; gap:10px; flex-wrap:wrap; margin-top:10px}
  </style>
</head>
<body>
  <div class="box">
    <h1>✅ Inscription envoyée</h1>
    <p>
      Merci ! Nous avons bien reçu votre demande d’inscription au programme affilié Maavnica SmartCard.
      Nous revenons vers vous rapidement par email avec les infos et les supports.
    </p>

    <div class="row">
      <a class="btn" href="https://smartcard.maavnica.com">← Retour au site</a>
      <a class="btn" href="https://smartcard.maavnica.com/devenir-affilie.html">Revenir au formulaire</a>
    </div>
  </div>
</body>
</html>
