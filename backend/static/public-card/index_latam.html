<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SmartCard LATAM</title>
  <style>
    :root {
      --latam-accent-deep: #0f766e;
      --latam-accent: #0d9488;
      --latam-accent-soft: #14b8a6;
      --latam-sector-glow: rgba(20, 184, 166, 0.18);
      --latam-sheet: #fcfcfd;
      --latam-sheet-edge: rgba(15, 23, 42, 0.06);
      --latam-text: #0f172a;
      --latam-text-muted: #475467;
      --latam-text-soft: #64748b;
      --latam-radius-outer: 24px;
      --latam-radius-btn: 15px;
      --latam-shadow-sheet:
        0 0 0 1px rgba(255, 255, 255, 0.75) inset,
        0 1px 0 rgba(15, 23, 42, 0.04),
        0 28px 56px -28px rgba(15, 23, 42, 0.28),
        0 12px 24px -16px rgba(15, 118, 110, 0.12);
      --latam-shadow-float: 0 20px 44px -22px rgba(15, 23, 42, 0.35);
    }

    * { box-sizing: border-box; }

    body.latam-premium-card {
      margin: 0;
      min-height: 100dvh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--latam-text);
      background-color: #0b1220;
      background-image:
        radial-gradient(100% 80% at 50% -5%, rgba(45, 212, 191, 0.12), transparent 55%),
        radial-gradient(90% 55% at 100% 0%, rgba(99, 102, 241, 0.08), transparent 45%),
        radial-gradient(70% 50% at 0% 100%, rgba(14, 165, 233, 0.06), transparent 50%),
        linear-gradient(165deg, #0f172a 0%, #151f33 38%, #1a2744 100%);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body.latam-premium-card[data-latam-sector="bienestar"] {
      --latam-sector-glow: rgba(167, 139, 250, 0.22);
      background-image:
        radial-gradient(100% 75% at 50% -8%, rgba(167, 139, 250, 0.14), transparent 52%),
        radial-gradient(85% 50% at 0% 20%, rgba(244, 114, 182, 0.08), transparent 48%),
        linear-gradient(168deg, #0f172a 0%, #1a1533 45%, #221c3d 100%);
    }

    body.latam-premium-card[data-latam-sector="artisan"] {
      --latam-sector-glow: rgba(45, 212, 191, 0.2);
      background-image:
        radial-gradient(100% 70% at 50% -5%, rgba(34, 197, 94, 0.1), transparent 50%),
        radial-gradient(80% 45% at 100% 90%, rgba(20, 184, 166, 0.08), transparent 48%),
        linear-gradient(168deg, #0c1822 0%, #132032 42%, #152e32 100%);
    }

    body.latam-premium-card[data-latam-sector="immo"] {
      --latam-sector-glow: rgba(251, 191, 36, 0.12);
      background-image:
        radial-gradient(90% 60% at 80% -10%, rgba(251, 191, 36, 0.1), transparent 50%),
        radial-gradient(70% 50% at 0% 100%, rgba(148, 163, 184, 0.1), transparent 48%),
        linear-gradient(168deg, #0b1220 0%, #152032 40%, #1e293b 100%);
    }

    body.latam-premium-card[data-latam-sector="estetica"] {
      --latam-sector-glow: rgba(251, 113, 133, 0.16);
      background-image:
        radial-gradient(95% 70% at 50% -10%, rgba(251, 113, 133, 0.12), transparent 52%),
        radial-gradient(75% 50% at 100% 80%, rgba(253, 186, 116, 0.08), transparent 48%),
        linear-gradient(168deg, #101525 0%, #1a1528 45%, #251d35 100%);
    }

    .wrap {
      max-width: 400px;
      margin: 0 auto;
      padding: max(16px, env(safe-area-inset-top)) 14px max(28px, env(safe-area-inset-bottom));
    }

    .admin-preview-badge {
      max-width: 400px;
      margin: 0 auto 12px;
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 11px;
      line-height: 1.35;
      color: #c7d2fe;
      background: rgba(30, 41, 59, 0.65);
      border: 1px solid rgba(129, 140, 248, 0.35);
      text-align: center;
      backdrop-filter: blur(10px);
    }

    .card {
      position: relative;
      border-radius: var(--latam-radius-outer);
      overflow: hidden;
      box-shadow: var(--latam-shadow-float);
    }

    .compact-hero {
      position: relative;
      height: 104px;
      background: linear-gradient(
        128deg,
        var(--latam-accent-deep) 0%,
        var(--latam-accent) 38%,
        var(--latam-accent-soft) 88%
      );
      border-radius: var(--latam-radius-outer) var(--latam-radius-outer) 0 0;
    }

    .compact-hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(120% 90% at 20% 0%, var(--latam-sector-glow), transparent 55%);
      opacity: 0.95;
      pointer-events: none;
    }

    .compact-hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.2) 0%, transparent 42%);
      pointer-events: none;
      animation: latamHeroGlow 14s ease-in-out infinite alternate;
    }

    @keyframes latamHeroGlow {
      from { opacity: 0.85; }
      to { opacity: 1; }
    }

    .card-inner {
      position: relative;
      z-index: 2;
      margin-top: -40px;
      padding: 44px 16px 20px;
      background: var(--latam-sheet);
      border-radius: var(--latam-radius-outer);
      border: 1px solid var(--latam-sheet-edge);
      box-shadow: var(--latam-shadow-sheet);
    }

    .top {
      display: flex;
      gap: 14px;
      align-items: flex-end;
      margin-top: -8px;
      margin-bottom: 14px;
      position: relative;
      z-index: 2;
    }

    .avatar-shell {
      position: relative;
      width: 100px;
      height: 100px;
      flex-shrink: 0;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid #fff;
      box-shadow:
        0 0 0 1px rgba(15, 23, 42, 0.06),
        0 16px 40px -12px rgba(15, 23, 42, 0.35);
      background: linear-gradient(145deg, #f4f4f5 0%, #e4e4e7 100%);
    }

    #avatar {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      opacity: 0;
      z-index: 2;
      transition: opacity 0.28s ease-out;
    }

    #avatar.is-loaded {
      opacity: 1;
    }

    #avatar-placeholder {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(145deg, #fafafa 0%, #e4e4e7 55%, #d4d4d8 100%);
    }

    #avatar-placeholder.is-hidden {
      display: none;
    }

    #avatar-fallback {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: #3f3f46;
      background: linear-gradient(145deg, #fafafa 0%, #e7e7ea 100%);
    }

    .identity-block {
      flex: 1;
      min-width: 0;
      padding-bottom: 4px;
    }

    #display-name {
      margin: 0;
      font-size: 1.3125rem;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.03em;
      color: var(--latam-text);
      word-wrap: break-word;
    }

    #job-line {
      margin-top: 6px;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--latam-text-muted);
      line-height: 1.35;
      word-wrap: break-word;
    }

    #job-line:empty {
      display: none;
    }

    #city-line {
      margin-top: 4px;
      font-size: 0.8125rem;
      color: var(--latam-text-soft);
      line-height: 1.45;
      word-wrap: break-word;
    }

    #city-line:empty {
      display: none;
    }

    .latam-trust-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 14px;
    }

    .latam-trust-strip[hidden] {
      display: none !important;
    }

    .latam-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 11px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1.25;
      color: #0f172a;
      background: linear-gradient(180deg, #fff 0%, #f4f4f5 100%);
      border: 1px solid rgba(15, 23, 42, 0.08);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    .latam-pill--google {
      color: #92400e;
      background: linear-gradient(180deg, #fffbeb 0%, #fef3c7 100%);
      border-color: rgba(245, 158, 11, 0.28);
    }

    .latam-pill--reco {
      color: #1e3a8a;
      background: linear-gradient(180deg, #eff6ff 0%, #dbeafe 100%);
      border-color: rgba(37, 99, 235, 0.22);
    }

    .latam-pill--reco.latam-pill--pulse {
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    #latam-wa-badge-title {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--latam-accent-deep);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.95) 0%, rgba(240, 253, 250, 0.9) 100%);
      border: 1px solid rgba(13, 148, 136, 0.2);
      margin: 0 0 6px;
      line-height: 1.3;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.8) inset;
    }

    #latam-wa-badge-title::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.35);
      flex-shrink: 0;
    }

    .latam-wa-micro {
      margin: 0 0 14px;
      font-size: 13px;
      line-height: 1.5;
      color: var(--latam-text-muted);
    }

    .latam-wa-micro:empty {
      display: none;
    }

    .latam-hero-block {
      margin-bottom: 14px;
    }

    .latam-hero-block[hidden] {
      display: none !important;
    }

    .latam-hero-block .lead {
      margin: 0 0 8px;
    }

    .latam-hero-block .desc {
      margin: 0 0 8px;
    }

    .latam-hero-cta {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.45;
      color: var(--latam-accent-deep);
    }

    .latam-hero-cta:empty {
      display: none;
    }

    .lead {
      margin: 0 0 8px;
      font-size: 1.0625rem;
      font-weight: 700;
      line-height: 1.32;
      letter-spacing: -0.02em;
      color: var(--latam-text);
    }

    .desc {
      margin: 0 0 14px;
      font-size: 0.9375rem;
      line-height: 1.5;
      color: var(--latam-text-muted);
    }

    #latam-lead[hidden],
    #latam-desc[hidden] {
      display: none !important;
    }

    .latam-reco-panel {
      margin: 4px 0 18px;
      padding: 14px 14px 13px;
      border-radius: 16px;
      background: linear-gradient(165deg, rgba(37, 99, 235, 0.06) 0%, rgba(99, 102, 241, 0.05) 100%);
      border: 1px solid rgba(37, 99, 235, 0.14);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.7) inset;
    }

    .latam-reco-panel__kicker {
      margin: 0 0 6px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #1d4ed8;
    }

    #latam-reco-panel-copy {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.45;
      color: #0f172a;
    }

    #latam-reco-panel-copy .latam-reco-num {
      font-weight: 800;
      color: #1d4ed8;
      font-variant-numeric: tabular-nums;
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: var(--latam-radius-btn);
      padding: 14px 16px;
      font-weight: 700;
      font-size: 0.9375rem;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.22) inset;
    }

    .btn + .btn {
      margin-top: 11px;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.985);
    }

    .btn-wa {
      background: linear-gradient(180deg, #22c55e 0%, #16a34a 100%);
      color: #fff;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.25) inset,
        0 14px 32px -14px rgba(22, 163, 74, 0.55);
    }

    .btn-wa:hover:not(:disabled) {
      filter: brightness(1.05);
    }

    .btn-review {
      background: linear-gradient(180deg, #fff 0%, #f4f4f5 100%);
      color: var(--latam-text);
      border: 1px solid rgba(15, 23, 42, 0.08);
      box-shadow: 0 8px 20px -12px rgba(15, 23, 42, 0.18);
    }

    .btn-review:hover:not(:disabled) {
      filter: brightness(1.02);
    }

    .btn-reco {
      position: relative;
      background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
      color: #fff;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.22) inset,
        0 14px 36px -14px rgba(29, 78, 216, 0.55);
    }

    .btn-reco:hover:not(:disabled) {
      filter: brightness(1.05);
    }

    .hint {
      margin-top: 16px;
      text-align: center;
      font-size: 12px;
      line-height: 1.45;
      color: var(--latam-text-soft);
    }

    .hint[hidden] {
      display: none !important;
    }

    .foot {
      margin-top: 12px;
      text-align: center;
      font-size: 11px;
      color: var(--latam-text-soft);
      opacity: 0.85;
    }

    @media (max-width: 360px) {
      .wrap { padding-left: 12px; padding-right: 12px; }
      .avatar-shell { width: 92px; height: 92px; }
      .card-inner { margin-top: -36px; padding-top: 40px; }
      #display-name { font-size: 1.1875rem; }
    }
  </style>
</head>
<body class="latam-premium-card">
  <div id="admin-preview-badge" class="admin-preview-badge" hidden>
    Mode prévisualisation — statistiques non comptabilisées
  </div>
  <main class="wrap">
    <section class="card">
      <div class="compact-hero" aria-hidden="true"></div>
      <div class="card-inner">
        <div class="top">
          <div class="avatar-shell">
            <img id="avatar" alt="Foto profesional" width="100" height="100" />
            <span id="avatar-placeholder" aria-hidden="true"></span>
            <span id="avatar-fallback"></span>
          </div>
          <div class="identity-block">
            <h1 id="display-name">SmartCard</h1>
            <div class="meta" id="job-line"></div>
            <div class="meta" id="city-line"></div>
          </div>
        </div>

        <div id="latam-trust-strip" class="latam-trust-strip" hidden>
          <span id="latam-google-pill" class="latam-pill latam-pill--google" hidden></span>
          <span id="latam-reco-pill" class="latam-pill latam-pill--reco" hidden></span>
        </div>

        <p id="latam-wa-badge-title" role="status">WhatsApp directo</p>
        <p class="latam-wa-micro" id="latam-wa-micro"></p>

        <div id="latam-hero-block" class="latam-hero-block" hidden>
          <p class="lead" id="latam-hero-title"></p>
          <p class="desc" id="latam-hero-text"></p>
          <p class="latam-hero-cta" id="latam-hero-cta"></p>
        </div>

        <p class="lead" id="latam-lead"></p>
        <p class="desc" id="latam-desc"></p>

        <div class="latam-reco-panel" id="latam-reco-panel">
          <p class="latam-reco-panel__kicker" id="latam-reco-panel-kicker">Recomendación</p>
          <p id="latam-reco-panel-copy"></p>
        </div>

        <button class="btn btn-wa" id="btn-whatsapp" type="button">Contactar por WhatsApp</button>
        <button class="btn btn-review" id="btn-review" type="button">Dejar una opinión</button>
        <button class="btn btn-reco" id="btn-recommend" type="button">Recomendar a un amigo</button>

        <div class="hint" id="latam-hint" hidden></div>
        <div class="foot">Propulsado por Maavnica</div>
      </div>
    </section>
  </main>

  <script>
    /**
     * TODO(analytics): Datos históricos pueden seguir contaminados antes de este parche.
     * El filtro isInternalView aplica desde el despliegue (sin purga automática).
     */
    var INTERNAL_CARDS_LS_KEY = "maavnica_internal_cards";
    var INTERNAL_MODE_LS_KEY = "maavnica_internal_mode";

    function deviceInternalModeActive() {
      try {
        return localStorage.getItem(INTERNAL_MODE_LS_KEY) === "1";
      } catch (e) {
        return false;
      }
    }

    function getSlugFromPath() {
      var parts = (window.location.pathname || "").split("/").filter(Boolean);
      if (parts.length >= 2 && parts[0] === "c") return decodeURIComponent(parts[1]);
      return null;
    }

    function internalSlugStorageKey(slug) {
      var s = (slug || "").trim().toLowerCase();
      return s || "";
    }

    function getInternalSlugsMap() {
      try {
        var raw = localStorage.getItem(INTERNAL_CARDS_LS_KEY);
        if (!raw) return {};
        var o = JSON.parse(raw);
        return o !== null && typeof o === "object" && !Array.isArray(o) ? o : {};
      } catch (e) {
        return {};
      }
    }

    function markSlugAsInternal(slug) {
      var key = internalSlugStorageKey(slug);
      if (!key) return;
      try {
        var m = getInternalSlugsMap();
        m[key] = true;
        localStorage.setItem(INTERNAL_CARDS_LS_KEY, JSON.stringify(m));
      } catch (e) {}
    }

    function unmarkSlugInternal(slug) {
      var key = internalSlugStorageKey(slug);
      if (!key) return;
      try {
        var m = getInternalSlugsMap();
        delete m[key];
        localStorage.setItem(INTERNAL_CARDS_LS_KEY, JSON.stringify(m));
      } catch (e) {}
    }

    function isSlugMarkedInternal(slug) {
      var key = internalSlugStorageKey(slug);
      if (!key) return false;
      return !!getInternalSlugsMap()[key];
    }

    function urlHasAdminViewFlag() {
      try {
        return new URLSearchParams(window.location.search || "").get("admin_view") === "1";
      } catch (e) {
        return false;
      }
    }

    var isInternalView = false;

    function migrateLegacyAdminViewFlag(slug) {
      try {
        if (localStorage.getItem("smartcard_admin_view") === "1" && slug) {
          markSlugAsInternal(slug);
          localStorage.removeItem("smartcard_admin_view");
        }
      } catch (e) {}
    }

    function refreshIsInternalView(slug) {
      migrateLegacyAdminViewFlag(slug);
      isInternalView =
        deviceInternalModeActive() ||
        urlHasAdminViewFlag() ||
        !!(slug && isSlugMarkedInternal(slug));
      var badge = document.getElementById("admin-preview-badge");
      if (badge) badge.hidden = !isInternalView;
    }

    function shouldTrackAnalytics() {
      return !isInternalView;
    }

    function syncInternalViewFromUrl(slug) {
      try {
        var p = new URLSearchParams(window.location.search || "");
        if (p.get("admin_view") === "1") {
          if (slug) markSlugAsInternal(slug);
          localStorage.setItem(INTERNAL_MODE_LS_KEY, "1");
        }
        if (p.get("admin_view") === "0") {
          if (slug) unmarkSlugInternal(slug);
          localStorage.removeItem(INTERNAL_MODE_LS_KEY);
        }
      } catch (e) {}
    }

    function getPublicCardUrl(slug) {
      if (!slug) return "";
      return "https://smartcard.maavnica.com/c/" + encodeURIComponent(slug);
    }

    function openRecommendationShareUrl(url) {
      if (!url) return;
      try {
        if (window.self !== window.top) {
          var w = window.open(url, "_blank", "noopener,noreferrer");
          if (w) return;
          var a = document.createElement("a");
          a.href = url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          document.body.appendChild(a);
          a.click();
          a.remove();
          return;
        }
      } catch (e) {
        window.open(url, "_blank", "noopener,noreferrer");
        return;
      }
      window.location.href = url;
    }

    function getUrlTrackingParams() {
      try {
        var p = new URLSearchParams(window.location.search || "");
        return { src: p.get("src") || null, ref: p.get("ref") || null, rec: p.get("rec") || null };
      } catch (e) {
        return { src: null, ref: null, rec: null };
      }
    }

    function postAnalytics(url, body) {
      try {
        fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
          keepalive: true
        }).catch(function () {});
      } catch (e) {}
    }

    function trackCardVisit(slug) {
      if (!shouldTrackAnalytics()) return;
      var t = getUrlTrackingParams();
      postAnalytics("/api/analytics/visit", { slug: slug, src: t.src, ref: t.ref, rec: t.rec });
    }

    function trackCardEvent(slug, eventType) {
      if (!shouldTrackAnalytics()) return;
      var t = getUrlTrackingParams();
      postAnalytics("/api/analytics/event", {
        slug: slug,
        event_type: eventType,
        src: t.src,
        ref: t.ref,
        rec: t.rec
      });
    }

    function generateRecommendationToken() {
      return "rec_" + Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 6);
    }

    async function ensureReferrerProfileForRecommendationLink() {
      // Version simplifiée LATAM: identité facultative, token opaque côté tracking.
      return { referrerId: generateRecommendationToken() };
    }

    function trackRecommendationEvent(cardSlug, eventType, referrerId) {
      if (!shouldTrackAnalytics()) return;
      if (!cardSlug || !eventType || !referrerId) return;
      postAnalytics("/api/analytics/recommendation-event", {
        card_slug: cardSlug,
        referrer_id: referrerId,
        visitor_id: null,
        event_type: eventType
      });
    }

    /** Digits only for https://wa.me/<number> (leading + must not be URL-encoded in path). */
    function whatsAppMeDigits(phone) {
      var d = (phone || "").replace(/\D/g, "");
      return d || "";
    }

    function latamSlugIsDemo(slug) {
      return !!(slug && String(slug).trim().toLowerCase().startsWith("demo"));
    }

    function latamProfileTone(profile, job) {
      var p = (profile || "").toString().trim().toLowerCase();
      var j = (job || "").toString().toLowerCase();
      if (
        p === "artisan" ||
        /plom|fontan|electric|albañ|albanil|cerraj|aire acond|manten|obr|herrer|jardiner|limpiez|fumig|servic/i.test(j)
      ) {
        return {
          sector: "artisan",
          waBadge: "Respuesta ágil por WhatsApp",
          lead: "Aquí resolvemos con manos expertas y palabra clara.",
          desc: "Cuéntame qué pasa en tu casa o negocio: te oriento y vemos el siguiente paso juntos.",
          waMicro: "Si es urgente, escribe ya: priorizo lo que no puede esperar.",
          recoZero: "En oficios de confianza, el boca a boca vale más que mil anuncios. Si te atendí bien, comparte mi contacto.",
          recoHas: "Ya van <span class=\"latam-reco-num\"></span> personas que pasaron el contacto: gracias por la confianza de verdad."
        };
      }
      if (
        p === "bien_etre" ||
        /terap|psicolog|psico|masaje|yoga|bienestar|acomp|coach|mindful|holíst|salud mental|counsel/i.test(j)
      ) {
        return {
          sector: "bienestar",
          waBadge: "Primer contacto con calma",
          lead: "Un espacio para hablar sin prisa, con respeto y escucha de verdad.",
          desc: "Si necesitas apoyo o orientación, escríbeme: respondemos con cuidado y discreción.",
          waMicro: "Puedes contar lo esencial por WhatsApp y coordinamos sin presión.",
          recoZero: "Cuando alguien recomienda un acompañante de confianza, alivia el primer paso. Si te hizo bien, pasa el contacto.",
          recoHas: "Llevamos <span class=\"latam-reco-num\"></span> veces que alguien compartió este perfil: gracias por ayudar a otras personas a encontrar apoyo."
        };
      }
      if (
        p === "immo" ||
        /inmobili|corredor|asesor.? inmob|propiedad|renta de|venta de casas|agencia de bienes|aval[uú]o/i.test(j)
      ) {
        return {
          sector: "immo",
          waBadge: "Asesoría directa",
          lead: "Decisiones de patrimonio con claridad, rigor y acompañamiento cercano.",
          desc: "Comprar, vender o rentar merece tiempo y respuestas serias. Hablemos por WhatsApp con tranquilidad.",
          waMicro: "Te respondo con orden y seguimiento: cada mensaje cuenta.",
          recoZero: "En bienes raíces, la referencia de un conocido abre puertas. Si valoraste la asesoría, compártela.",
          recoHas: "<span class=\"latam-reco-num\"></span> recomendaciones compartidas: la confianza se nota en cada referido."
        };
      }
      if (
        /estil|peluqu|barber|uñas|manic|maquill|spa|facial|bellez|cosmet|pein|cejas|lash|cabell|coloraci|alisad/i.test(
          j
        )
      ) {
        return {
          sector: "estetica",
          waBadge: "Reserva y consultas por WhatsApp",
          lead: "Detalle, estilo y una mano cálida para que te sientas increíble.",
          desc: "Pregunta por disponibilidad o ideas para tu look: te respondo con gusto y cercanía.",
          waMicro: "Ideal para coordinar tu cita o resolver dudas sin filas ni complicaciones.",
          recoZero: "Lo bonito se comparte: si te gustó el resultado, invita a alguien a conocer este espacio.",
          recoHas: "Van <span class=\"latam-reco-num\"></span> veces que clientes compartieron este perfil: gracias por llevar la recomendación más allá."
        };
      }
      return {
        sector: "default",
        waBadge: "WhatsApp directo",
        lead: "Una forma humana y simple de conectar contigo.",
        desc: "Escríbeme con confianza: aclaramos dudas y seguimos al ritmo que necesites.",
        waMicro: "Me importa que te sientas atendido, no solo “en línea”.",
        recoZero: "La mejor publicidad es un cliente que te recomienda. Si te gustó la experiencia, compártela con alguien que lo necesite.",
        recoHas: "Sumamos <span class=\"latam-reco-num\"></span> veces que alguien compartió este contacto: la comunidad lo nota."
      };
    }

    function latamFormatRating(n) {
      if (n == null || n === "" || isNaN(Number(n))) return "";
      var x = Number(n);
      var s = (Math.round(x * 10) / 10).toString().replace(".", ",");
      return s;
    }

    function latamExpandHex3(h) {
      if (h.length === 3) return h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
      return h;
    }

    function latamHexToRgb(hex) {
      var x = (hex || "").replace("#", "").trim();
      if (!x) return null;
      if (x.length === 3) x = latamExpandHex3(x);
      if (x.length !== 6) return null;
      var r = parseInt(x.slice(0, 2), 16);
      var g = parseInt(x.slice(2, 4), 16);
      var b = parseInt(x.slice(4, 6), 16);
      if (isNaN(r) || isNaN(g) || isNaN(b)) return null;
      return { r: r, g: g, b: b };
    }

    function latamRgbToHex(r, g, b) {
      function h(n) {
        var s = Math.max(0, Math.min(255, Math.round(n))).toString(16);
        return s.length === 1 ? "0" + s : s;
      }
      return "#" + h(r) + h(g) + h(b);
    }

    function latamMixToward(rgb, target, t) {
      return {
        r: rgb.r + (target.r - rgb.r) * t,
        g: rgb.g + (target.g - rgb.g) * t,
        b: rgb.b + (target.b - rgb.b) * t
      };
    }

    function latamApplyThemeColor(hex) {
      var raw = (hex || "").toString().trim();
      if (!raw) return;
      if (!/^#?[0-9a-fA-F]{3,6}$/.test(raw)) return;
      var h = raw[0] === "#" ? raw : "#" + raw;
      if (h.length === 4 || h.length === 7) {
        var rgb = latamHexToRgb(h);
        if (!rgb) return;
        var deep = latamMixToward(rgb, { r: 15, g: 23, b: 42 }, 0.32);
        var soft = latamMixToward(rgb, { r: 255, g: 255, b: 255 }, 0.22);
        var cDeep = latamRgbToHex(deep.r, deep.g, deep.b);
        var cSoft = latamRgbToHex(soft.r, soft.g, soft.b);
        document.documentElement.style.setProperty("--latam-accent", h);
        document.documentElement.style.setProperty("--latam-accent-deep", cDeep);
        document.documentElement.style.setProperty("--latam-accent-soft", cSoft);
        var hero = document.querySelector(".compact-hero");
        if (hero) {
          hero.style.background =
            "linear-gradient(125deg, " + cDeep + " 0%, " + h + " 44%, " + cSoft + " 100%)";
        }
      }
    }

    function latamFillRecoPanel(htmlTemplate, n) {
      var el = document.getElementById("latam-reco-panel-copy");
      if (!el || !htmlTemplate) return;
      el.innerHTML = htmlTemplate;
      var span = el.querySelector(".latam-reco-num");
      if (span && n != null) span.textContent = String(n);
    }

    function latamSyncTrustAndCopy(card, slugNorm, job) {
      var strip = document.getElementById("latam-trust-strip");
      var gPill = document.getElementById("latam-google-pill");
      var rPill = document.getElementById("latam-reco-pill");
      var waMicro = document.getElementById("latam-wa-micro");
      var waBadge = document.getElementById("latam-wa-badge-title");
      var heroBlock = document.getElementById("latam-hero-block");
      var heroTitle = document.getElementById("latam-hero-title");
      var heroText = document.getElementById("latam-hero-text");
      var heroCta = document.getElementById("latam-hero-cta");
      var leadEl = document.getElementById("latam-lead");
      var descEl = document.getElementById("latam-desc");
      var hintEl = document.getElementById("latam-hint");

      var tone = latamProfileTone(card.profile, job);
      document.body.setAttribute("data-latam-sector", tone.sector || "default");

      if (waBadge) waBadge.textContent = tone.waBadge || "WhatsApp directo";
      if (waMicro) waMicro.textContent = tone.waMicro || "";

      var rating = card.google_rating;
      var count = card.google_review_count;
      var recoN = card.recommendation_share_count;
      var hasG = (rating != null && !isNaN(Number(rating))) || (count != null && Number(count) > 0);
      var hasR = recoN != null && Number(recoN) > 0;

      if (gPill) {
        if (hasG) {
          var parts = [];
          if (rating != null && !isNaN(Number(rating))) parts.push("★ " + latamFormatRating(rating));
          if (count != null && Number(count) > 0) {
            var c = Number(count);
            parts.push(c === 1 ? "1 opinión" : c + " opiniones");
          }
          gPill.textContent = parts.join(" · ") + " en Google";
          gPill.hidden = false;
        } else {
          gPill.textContent = "";
          gPill.hidden = true;
        }
      }
      if (rPill) {
        if (hasR) {
          var n = Number(recoN);
          rPill.textContent =
            n === 1 ? "1 contacto compartido por clientes" : n + " contactos compartidos · boca a boca real";
          rPill.hidden = false;
          rPill.classList.add("latam-pill--pulse");
        } else {
          rPill.textContent = "";
          rPill.hidden = true;
          rPill.classList.remove("latam-pill--pulse");
        }
      }
      if (strip) strip.hidden = !(hasG || hasR);

      var recoPanelKicker = document.getElementById("latam-reco-panel-kicker");
      if (recoPanelKicker) recoPanelKicker.textContent = hasR ? "Boca a boca activo" : "Tu recomendación importa";

      if (hasR) {
        latamFillRecoPanel(tone.recoHas, Number(recoN));
      } else {
        latamFillRecoPanel(tone.recoZero, null);
      }

      var ht = (card.hero_title || "").toString().trim();
      var hx = (card.hero_text || "").toString().trim();
      var hc = (card.hero_cta_text || "").toString().trim();

      if (ht && heroBlock && heroTitle && heroText && heroCta) {
        heroTitle.textContent = ht;
        heroText.textContent = hx || "";
        heroCta.textContent = hc || "";
        heroText.hidden = !hx;
        heroCta.hidden = !hc;
        heroBlock.hidden = false;
        if (leadEl) {
          leadEl.textContent = "";
          leadEl.hidden = true;
        }
        if (descEl) {
          descEl.textContent = "";
          descEl.hidden = true;
        }
      } else {
        if (heroBlock) heroBlock.hidden = true;
        if (heroTitle) heroTitle.textContent = "";
        if (heroText) {
          heroText.textContent = "";
          heroText.hidden = false;
        }
        if (heroCta) {
          heroCta.textContent = "";
          heroCta.hidden = false;
        }
        if (leadEl) {
          leadEl.hidden = false;
          leadEl.textContent = tone.lead;
        }
        if (descEl) {
          descEl.hidden = false;
          descEl.textContent = tone.desc;
        }
      }

      latamApplyThemeColor(card.theme_color);

      if (hintEl) {
        if (latamSlugIsDemo(slugNorm)) {
          hintEl.hidden = false;
          hintEl.textContent = "Demostración interactiva — sin compromiso.";
        } else {
          hintEl.hidden = true;
          hintEl.textContent = "";
        }
      }
    }

    async function loadCard() {
      var slug = getSlugFromPath();
      if (!slug) return;

      syncInternalViewFromUrl(slug);
      refreshIsInternalView(slug);

      var cardSection = document.querySelector(".card");
      var res = await fetch("/api/public/cards/" + encodeURIComponent(slug));
      if (!res.ok) {
        var msg =
          res.status === 403
            ? "Esta tarjeta ya no está activa."
            : "No se encontró esta tarjeta.";
        if (cardSection) {
          cardSection.innerHTML =
            '<p style="padding:20px 14px;text-align:center;margin:0;color:#475467;">' +
            msg +
            "</p>";
        }
        return;
      }
      var card = await res.json();

      var canonicalSlug =
        card.slug != null && String(card.slug).trim()
          ? String(card.slug).trim()
          : slug;
      var slugLower = String(canonicalSlug).trim().toLowerCase();
      var publicUrl = getPublicCardUrl(canonicalSlug);
      var fullName = (card.display_name || card.company_name || "SmartCard").trim();
      var job = (card.job_title || "").trim();
      var biz = (card.business_name || "").trim();
      var cityField = (card.city || "").trim();
      var cityParts = [];
      if (biz) cityParts.push(biz);
      if (cityField) cityParts.push(cityField);
      var cityLineText = cityParts.join(" · ");

      document.getElementById("display-name").textContent = fullName;
      document.getElementById("job-line").textContent = job;
      document.getElementById("city-line").textContent = cityLineText;

      latamSyncTrustAndCopy(card, slugLower, job);

      var avatarImg = document.getElementById("avatar");
      var avatarPh = document.getElementById("avatar-placeholder");
      var avatarFb = document.getElementById("avatar-fallback");
      var avatarUrl = (card.avatar_url || "").toString().trim();

      function getAvatarInitials() {
        var dn = (card.display_name || "").toString().trim();
        if (dn) {
          var parts = dn.split(/\s+/).filter(Boolean);
          if (parts.length >= 2) {
            var s = ((parts[0][0] || "") + (parts[1][0] || "")).toUpperCase();
            if (s) return s;
          }
          if (parts.length === 1 && parts[0].length) {
            return parts[0].slice(0, 2).toUpperCase();
          }
        }
        var co = (card.company_name || "").toString().trim();
        if (co) return co.slice(0, 2).toUpperCase();
        return fullName.slice(0, 2).toUpperCase() || "SC";
      }

      var phTimer = null;
      function clearPhTimer() {
        if (phTimer != null) {
          clearTimeout(phTimer);
          phTimer = null;
        }
      }

      function showLatamInitialsOnly() {
        clearPhTimer();
        if (avatarPh) avatarPh.classList.add("is-hidden");
        if (avatarImg) {
          avatarImg.classList.remove("is-loaded");
          avatarImg.removeAttribute("src");
          avatarImg.onload = null;
          avatarImg.onerror = null;
        }
        if (avatarFb) {
          avatarFb.textContent = getAvatarInitials();
          avatarFb.style.display = "flex";
        }
      }

      if (avatarImg && avatarPh && avatarFb) {
        if (!avatarUrl) {
          showLatamInitialsOnly();
        } else {
          avatarFb.style.display = "none";
          avatarFb.textContent = "";
          avatarPh.classList.remove("is-hidden");
          clearPhTimer();
          avatarImg.classList.remove("is-loaded");
          avatarImg.onload = null;
          avatarImg.onerror = null;
          avatarImg.removeAttribute("src");
          avatarImg.onload = function () {
            requestAnimationFrame(function () {
              requestAnimationFrame(function () {
                clearPhTimer();
                avatarImg.classList.add("is-loaded");
                phTimer = window.setTimeout(function () {
                  avatarPh.classList.add("is-hidden");
                  phTimer = null;
                }, 220);
              });
            });
          };
          avatarImg.onerror = function () {
            clearPhTimer();
            showLatamInitialsOnly();
          };
          avatarImg.src = avatarUrl;
        }
      }

      document.title = fullName + " - SmartCard LATAM";

      var waBtn = document.getElementById("btn-whatsapp");
      var reviewBtn = document.getElementById("btn-review");
      var recoBtn = document.getElementById("btn-recommend");

      waBtn.onclick = function () {
        var waDigits = whatsAppMeDigits(card.whatsapp || card.phone || "");
        if (!waDigits) return;
        trackCardEvent(canonicalSlug, "whatsapp_click");
        window.location.href = "https://wa.me/" + waDigits;
      };

      reviewBtn.onclick = function () {
        if (!card.google_review_link) return;
        trackCardEvent(canonicalSlug, "google_review_click");
        window.open(card.google_review_link, "_blank", "noopener");
      };
      if (!card.google_review_link) {
        reviewBtn.disabled = true;
        reviewBtn.style.opacity = "0.5";
        reviewBtn.style.cursor = "not-allowed";
      }
      if (!whatsAppMeDigits(card.whatsapp || card.phone || "")) {
        waBtn.disabled = true;
        waBtn.style.opacity = "0.5";
        waBtn.style.cursor = "not-allowed";
      }

      recoBtn.onclick = async function () {
        var profile = await ensureReferrerProfileForRecommendationLink();
        if (!profile || !profile.referrerId) return;
        var recommendUrl = publicUrl + "?r=" + encodeURIComponent(profile.referrerId);
        var msg = "Hola, te recomiendo este profesional 👍\n" + recommendUrl;
        trackCardEvent(canonicalSlug, "recommend_click");
        trackCardEvent(canonicalSlug, "recommend_share_whatsapp");
        trackRecommendationEvent(canonicalSlug, "recommend_link_created", profile.referrerId);
        openRecommendationShareUrl("https://wa.me/?text=" + encodeURIComponent(msg));
      };

      trackCardVisit(canonicalSlug);
    }

    loadCard();
  </script>
</html>
