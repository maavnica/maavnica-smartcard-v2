<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Connexion – Administration SmartCard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/static/admin/style.css?v=admin-session-1" />
</head>
<body class="login-page">
  <main class="login-card">
    <div class="tag">Maavnica SmartCard – Admin</div>
    <h1>Connexion administrateur</h1>
    <p class="subtitle">Saisissez votre mot de passe administrateur pour ouvrir votre session.</p>

    <form id="admin-login-form" novalidate>
      <label for="admin-password">Mot de passe</label>
      <input
        id="admin-password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
        autofocus
      />
      <button class="btn btn-primary login-submit" type="submit">Se connecter</button>
    </form>
    <p id="login-error" class="login-error" role="alert" aria-live="polite"></p>
  </main>
  <script src="/static/admin/login.js?v=admin-session-1"></script>
</body>
</html>
